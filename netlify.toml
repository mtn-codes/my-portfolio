# netlify.toml
#
# Build + redirect configuration for Netlify.
#
# • Build the Vite app and publish the contents of `dist/`.
# • Functions live in `netlify/functions/` (see `kimchi.js`).
#
# Note: The actual URL → function redirect lives in `public/_redirects`
# (which Vite copies to `dist/_redirects` at build time). Netlify's
# `_redirects` file is processed at the CDN edge with higher priority than
# rules in `netlify.toml` for the same path, so the API redirect is
# declared there to avoid the catch-all SPA rule from `public/_redirects`
# shadowing it. We keep this file only for the function declaration
# (`[build]` block) and as a safety net for the SPA fallback.

[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# ─── API Proxies to Netlify Serverless Functions ─────────────────────────────
# Crucial: These must be declared BEFORE the SPA catch-all rule and have force=true
# so requests to /api/* are routed directly to the functions rather than being
# swallowed by the SPA fallback (which returns index.html).

[[redirects]]
  from   = "/api/openrouter"
  to     = "/.netlify/functions/openrouter"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/openrouter/*"
  to     = "/.netlify/functions/openrouter"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/bai"
  to     = "/.netlify/functions/bai"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/bai/*"
  to     = "/.netlify/functions/bai"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/kimchi"
  to     = "/.netlify/functions/kimchi"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/kimchi/*"
  to     = "/.netlify/functions/kimchi"
  status = 200
  force  = true

# Single-page-app fallback. Any route not matching an asset or function goes to index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
  force  = false

# Edge CDN Cache-Control headers for high-speed delivery
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/projects/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"